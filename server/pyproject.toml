[project]
name = "cognio-server"
version = "0.1.0"
description = "Serves Cognio course packs (.cognio) and the model catalog: a read-only file server with an index"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.46,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognio_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
